org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

## Environment
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.115
neo_version_range=[26.3.0.115,)

## Mod properties
mod_id=postrider
mod_name=Post Rider
mod_license=MIT
mod_version=1.3.1
mod_group_id=com.comedymonkey.postrider
mod_authors=James Knight
mod_description=Mounted post riders carry your letters and parcels between mailboxes, come rain, river or creeper.

## Multi-loader
java_version=25
# The plain Minecraft that common compiles against (https://projects.neoforged.net/neoforged/neoform)
neo_form_version=26.3-1

## Fabric (https://fabricmc.net/develop: meta.fabricmc.net for the loader, maven.fabricmc.net for Fabric API and Loom)
fabric_loader_version=0.20.1
fabric_api_version=0.167.0+26.3
# Fabric has no config system of its own: Forge Config API Port gives it NeoForge's, so the config file is the same
# (https://github.com/Fuzss/forge-config-api-port, Maven from https://github.com/Fuzss/modresources)
forge_config_api_port_version=26.3.1

## Forge (https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json: 26.3-recommended; the MDK for the
## ForgeGradle setup)
forge_version=66.1.9
forge_version_range=[66,)
forge_loader_version_range=[66,)
# ForgeGradle puts each source set's classes and resources in one folder, as Forge's MDK does, so a dev run sees the mod
# as one folder (read by ForgeGradle only, in the forge module)
net.minecraftforge.gradle.merge-source-sets=true
