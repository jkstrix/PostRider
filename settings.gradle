pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        exclusiveContent {
            forRepository {
                maven { name = 'Fabric'; url = uri('https://maven.fabricmc.net') }
            }
            filter { includeGroupAndSubgroups('net.fabricmc') }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'post-rider'
includeBuild('build-logic')
// The mod itself, free of any mod loader, and one module per loader that it's built for
include('common')
include('neoforge')
include('fabric')
