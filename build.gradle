plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // The in-world tests can be watched from a creative world: /test run postrider:<name>, or /test runall
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Opens a flat creative world of its own and runs the in-world tests in front of the player, to be watched:
        // all of them, or one with -Ptests=<name> (./gradlew runWatch -Ptests=heopensthedoorsonhiswayandleavesthemashefoundthem)
        watch {
            client()
            gameDirectory = project.file('run-watch')
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'postrider.trace', 'true'
            systemProperty 'postrider.watch', project.findProperty('tests') ?: 'all'
        }
        // Opens the screens with awkward contents, saves screenshots to run-screenshots/screenshots/postrider, and quits
        screenshots {
            client()
            gameDirectory = project.file('run-screenshots')
            systemProperty 'postrider.screenshots', 'true'
        }
        // The in-world tests (src/main/java/.../gametest): ./gradlew runGameTestServer runs them all and exits,
        // failing if any do, in a world of its own
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'postrider.trace', 'true'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Unit tests run inside a bootstrapped FML (registries, items and blocks are available)
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

// Each run of the in-world tests starts from a fresh world, so nothing is left over from the last
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-gametest/world') }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '3G'
    testLogging { events 'failed'; exceptionFormat 'full' }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
