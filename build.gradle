plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // The in-world tests can be watched from a creative world: /test run postrider:<name>, or /test runall
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Opens a flat creative world of its own and runs the in-world tests in front of the player, to be watched:
        // all of them, or one with -Ptests=<name> (./gradlew runWatch -Ptests=heopensthedoorsonhiswayandleavesthemashefoundthem)
        watch {
            client()
            gameDirectory = project.file('run-watch')
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'postrider.trace', 'true'
            systemProperty 'postrider.watch', project.findProperty('tests') ?: 'all'
        }
        // A headless trip across one of the client's worlds (run/saves/<world>, copied to run-headless/world): the server
        // starts on it, posts a parcel from one box to the other, logs the rider's progress, and stops once it's delivered
        // or lost. ./gradlew runHeadless -Pworld="New World (1)" -Pfrom=Testing -Pto=Smelly
        headless {
            server()
            gameDirectory = project.file('run-headless')
            programArgument '--nogui'
            systemProperty 'postrider.post', "${project.findProperty('from') ?: 'Testing'}|${project.findProperty('to') ?: 'Smelly'}"
            systemProperty 'postrider.sprint', "${project.findProperty('sprint') ?: 'true'}"
            systemProperty 'postrider.timeout', "${project.findProperty('timeout') ?: '30'}"
            systemProperty 'postrider.trace', 'true'
            systemProperty 'postrider.traceAll', 'true'
        }
        // Opens the screens with awkward contents, saves screenshots to run-screenshots/screenshots/postrider, and quits
        screenshots {
            client()
            gameDirectory = project.file('run-screenshots')
            systemProperty 'postrider.screenshots', 'true'
        }
        // The in-world tests (src/main/java/.../gametest): ./gradlew runGameTestServer runs them all and exits,
        // failing if any do, in a world of its own
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'postrider.trace', 'true'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Unit tests run inside a bootstrapped FML (registries, items and blocks are available)
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    testImplementation(platform('org.junit:junit-bom:5.10.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

// Each run of the in-world tests starts from a fresh world, so nothing is left over from the last
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-gametest/world') }
}

// The headless trip runs on a fresh copy of the chosen client world, so the client's own save is never touched
tasks.matching { it.name == 'runHeadless' }.configureEach {
    doFirst {
        def world = project.findProperty('world') ?: 'New World (1)'
        def dir = file('run-headless')
        dir.mkdirs()
        delete file("${dir}/world")
        def properties = ["level-name=world", "online-mode=false", "spawn-protection=0", "max-tick-time=-1", "view-distance=10", "simulation-distance=10"]
        if (world == 'new') {
            // A fresh, ordinary world is generated by the server itself: -Pseed=<seed> for the same one again
            properties += "level-type=minecraft\\:normal"
            if (project.findProperty('seed'))
                properties += "level-seed=${project.findProperty('seed')}"
        } else {
            def source = file("run/saves/${world}")
            if (!source.isDirectory())
                throw new GradleException("No world at ${source}: pass -Pworld=<name of a world in run/saves>, or -Pworld=new")
            copy {
                from source
                into file("${dir}/world")
            }
        }
        file("${dir}/eula.txt").text = "eula=true\n"
        file("${dir}/server.properties").text = properties.join("\n") + "\n"
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '3G'
    testLogging { events 'failed'; exceptionFormat 'full' }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
