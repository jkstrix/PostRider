plugins {
    // see https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml for new versions (1.19 needs Gradle 9.8). 1.21.1
    // is obfuscated, so it's Loom's remapping plugin (fabric-loom-remap), with Mojang's mappings
    id 'net.fabricmc.fabric-loom-remap' version '1.19.4' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

// Each loader module has the same run tasks (runHeadless, runWatch, runGameTestServer...). Asked for without a module,
// Gradle would run every loader's at once, so say which: ./gradlew :neoforge:runHeadless
gradle.projectsEvaluated {
    gradle.startParameter.taskNames.findAll { it.startsWith('run') && !it.contains(':') }.each { name ->
        def owners = subprojects.findAll { it.tasks.findByName(name) != null }
        if (owners.size() > 1)
            throw new GradleException("${name} is in ${owners*.name.join(', ')}: say which, for example ./gradlew :${owners[0].name}:${name}")
    }
}
